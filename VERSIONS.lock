## Blackwell / SM_120 target confirmation

Required CMake flag for llama.cpp on RTX 5090:
```
-DCMAKE_CUDA_ARCHITECTURES=120
```

Do not rely on the generic `-DGGML_CUDA=ON` default — spec §-1.4 warning.

